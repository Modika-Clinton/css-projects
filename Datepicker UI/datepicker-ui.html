<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UFT-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
        <title>Datepicker UI</title>
        <style>
            body {
                font-family: sans-serif;
                padding: 40px;
            }
            .date-picker {
                width: 300px;
                border: 2px solid black;
                align-items: center;
                margin-left: 25%;
            }
            /* Top input box*/
            .input-box {
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 2px solid black;
                padding: 10px 15px;
                font-size: 20px;
            }
            .icon {
                font-size: 24px;
                border-left: 2px solid black;
                padding-left: 10px;
            }
            .calender {
                padding: 10px;
            }
            .month {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 5px;
                font-size: 20px;
            }
            .weekdays.days {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                text-align: center;
            }
            .weekdays {
                margin: auto;
                padding: 2x;
                display: flex;
                font-size: 18px;
                gap: 30px;
                border-bottom: 2px solid black;
            }
            .days div {
                padding: 2px;
                margin: auto;
            }
            .days div:hover {
                background: #eee;
                cursor: pointer;
            }
            .row {
                position: relative;
                display: flex;
                justify-content: center;
                gap: 10px;
            }
            footer {
                font-family: "Segoe Print";
                text-align: center;
                margin-left: -15%;
            }
        </style>
    </head>
    <body>
        <mian>
            <div class="date-picker">
                <!--Top box-->
                <div class="input-box">
                    <span>dd / mm / yyyy</span>
                    <span class="icon">&#128197</span>
                </div>
                <!--Calender Popup-->
                <div class="calender">
                    <div class="month">
                        <span style="color: black;">&#9664;</span>
                        <span>December 2026</span>
                        <span style="color: black;">&#9654;</span>
                    </div>
                    <div class="weekdays">
                        <div>S</div><div>M</div><div>T</div><div>W</div>
                        <div>T</div><div>F</div><div>S</div>
                    </div>
                    <div class="days">
                        <div class="row">
                            <div></div><div></div><div></div><div></div>
                            <div>1</div><div>2</div><div>3</div>
                        </div><hr>
                        <div class="row">
                            <div>4</div><div>5</div><div>6</div><div>7</div>
                            <div>8</div><div>9</div><div>10</div>
                        </div><hr>
                        <div class="row">
                            <div>11</div><div>12</div><div>13</div><div>14</div>
                            <div>15</div><div>16</div><div>17</div>
                        </div><hr>
                        <div class="row">
                            <div>18</div><div>19</div><div>20</div><div>21</div>
                            <div>22</div><div>23</div><div>24</div>
                        </div><hr>
                        <div class="row">
                            <div>25</div><div>26</div><div>27</div><div>28</div>
                            <div>29</div><div>30</div><div>31</div>
                        </div>
                    </div>
                </div>
            </div>
        </mian><br>
        <footer>No JavaScript involve, do it with HTML and CSS</footer>
    </body>
</html>
